<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff1e27"/>
      <stop offset="100%" stop-color="#b80710"/>
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#800207"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#e50914" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#e50914" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Letra J (Netflix Ribbon Style) -->
  <g filter="url(#glow)">
    <path d="M16 16 H24 V38 C24 43 21 47 15 47 C12 47 9.5 45.8 8 44.2 L11 39 C12 39.9 13.2 40.5 14.8 40.5 C17 40.5 18 39.2 18 37 V16 Z" fill="url(#redGrad)"/>
    
    <!-- Letra P (Netflix Ribbon Style) -->
    <path d="M30 16 H44 C50 16 54 19.5 54 25.5 C54 31.5 50 35 44 35 H36 V47 H30 V16 Z M36 22 V29.5 H43.5 C46.5 29.5 48 28.2 48 25.5 C48 22.8 46.5 22 43.5 22 H36 Z" fill="url(#redGrad)"/>

    <!-- Dobra / Shadow de Profundidade Cinematográfica -->
    <path d="M30 16 L36 22 V35 L30 30 Z" fill="url(#foldGrad)" opacity="0.6"/>
  </g>
</svg>
